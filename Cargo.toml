[package]
name = "conf-mcp"
version = "0.1.0"
edition = "2024"
description = "Read-only stdio MCP server for Confluence Server 7.19.1"

[[test]]
name = "stdio_smoke"
path = "src/stdio_smoke.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
htmd = { version = "0.6", default-features = false, features = ["rcdom"] }
html5ever = "0.40"
markup5ever_rcdom = "0.40"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1"
url = "2"

[dev-dependencies]
bytes = "1"
http = "1"
http-body = "1"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "time"] }
